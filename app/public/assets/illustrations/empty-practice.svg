<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" role="img" aria-labelledby="emptyPracticeTitle emptyPracticeDesc">
  <title id="emptyPracticeTitle">Technical Practice Blueprint</title>
  <desc id="emptyPracticeDesc">Architectural isometric wireframe and drafting compass awaiting drill configuration.</desc>
  <defs>
    <linearGradient id="epGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1319" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#280B0F" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="epGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6B39A" />
      <stop offset="100%" stop-color="#7B694E" />
    </linearGradient>
    <linearGradient id="epGradRubine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D3A3C" />
      <stop offset="100%" stop-color="#3B1319" />
    </linearGradient>
  </defs>

  <!-- Ground Plane Isometric Grid -->
  <g opacity="0.35" stroke="#7B694E" stroke-width="0.75" stroke-dasharray="3 3">
    <path d="M60 210 L200 280 L340 210 L200 140 Z" />
    <path d="M100 190 L200 240 L300 190" />
    <path d="M140 170 L200 200 L260 170" />
    <line x1="200" y1="140" x2="200" y2="280" />
    <line x1="60" y1="210" x2="340" y2="210" />
  </g>

  <!-- Base Isometric Drafting Platform (Warm Ivory & Tamarind) -->
  <path d="M100 195 L200 245 L300 195 L200 145 Z" fill="url(#epGrad1)" stroke="#C6B39A" stroke-width="1.25" />
  
  <!-- Subtle Blueprint Accent Lines -->
  <path d="M120 185 L200 225 L280 185" stroke="#C6B39A" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7" />
  <path d="M140 175 L200 205 L260 175" stroke="#7B694E" stroke-width="0.75" opacity="0.6" />

  <!-- Layered Architecture Nodes (Simulating Distributed System Stack) -->
  <!-- Bottom Node Plate -->
  <path d="M160 160 L200 180 L240 160 L200 140 Z" fill="#280B0F" stroke="#7B694E" stroke-width="1" />
  <!-- Connecting Pillar Lines -->
  <line x1="160" y1="160" x2="160" y2="135" stroke="#7B694E" stroke-width="1" />
  <line x1="240" y1="160" x2="240" y2="135" stroke="#7B694E" stroke-width="1" />
  <line x1="200" y1="180" x2="200" y2="155" stroke="#C6B39A" stroke-width="1" />

  <!-- Middle Floating Service Layer -->
  <path d="M160 135 L200 155 L240 135 L200 115 Z" fill="url(#epGradRubine)" stroke="#C6B39A" stroke-width="1.25" />

  <!-- Connecting Struts to Apex Core -->
  <line x1="200" y1="115" x2="200" y2="85" stroke="#C6B39A" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Floating Diamond Apex (Diagnostic Engine) -->
  <g transform="translate(200, 75)">
    <polygon points="0,-22 18,0 0,22 -18,0" fill="#3B1319" stroke="url(#epGrad2)" stroke-width="1.5" />
    <polygon points="0,-12 10,0 0,12 -10,0" fill="#8D3A3C" stroke="#F2EADF" stroke-width="0.75" />
    <circle cx="0" cy="0" r="2.5" fill="#F2EADF" />
    <!-- Dynamic Orbit Ring -->
    <ellipse cx="0" cy="0" rx="32" ry="10" stroke="#C6B39A" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.6" />
  </g>

  <!-- Left: Precision Technical Compass Tool -->
  <g transform="translate(105, 110) rotate(-15)">
    <!-- Compass Legs -->
    <path d="M0,0 L-18,65" stroke="#C6B39A" stroke-width="2" stroke-linecap="round" />
    <path d="M0,0 L18,65" stroke="#C6B39A" stroke-width="2" stroke-linecap="round" />
    <!-- Compass Hinge & Dial -->
    <circle cx="0" cy="0" r="5" fill="#3B1319" stroke="#F2EADF" stroke-width="1.25" />
    <circle cx="0" cy="0" r="1.5" fill="#8D3A3C" />
    <path d="M-9,28 Q0,32 9,28" stroke="#7B694E" stroke-width="1.25" fill="none" />
  </g>

  <!-- Right: Technical Parchment / Code Invariant Card -->
  <g transform="translate(265, 120)">
    <rect x="0" y="0" width="55" height="70" rx="4" fill="#3B1319" stroke="#7B694E" stroke-width="1" />
    <!-- Editorial Linework on Parchment -->
    <line x1="8" y1="12" x2="35" y2="12" stroke="#8D3A3C" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="22" x2="47" y2="22" stroke="#C6B39A" stroke-width="1.25" stroke-linecap="round" />
    <line x1="8" y1="30" x2="42" y2="30" stroke="#C6B39A" stroke-width="1.25" stroke-linecap="round" />
    <line x1="8" y1="38" x2="38" y2="38" stroke="#7B694E" stroke-width="1.25" stroke-linecap="round" />
    <line x1="8" y1="46" x2="45" y2="46" stroke="#7B694E" stroke-width="1.25" stroke-linecap="round" />
    <circle cx="43" cy="58" r="4" fill="#8D3A3C" />
  </g>

  <!-- Ambient Luxury Star Sparks -->
  <polygon points="80,80 82,85 87,87 82,89 80,94 78,89 73,87 78,85" fill="#C6B39A" opacity="0.8" />
  <polygon points="320,85 321.5,88.5 325,90 321.5,91.5 320,95 318.5,91.5 315,90 318.5,88.5" fill="#F2EADF" opacity="0.7" />
  <polygon points="210,265 211,268 214,269 211,270 210,273 209,270 206,269 209,268" fill="#8D3A3C" opacity="0.8" />
</svg>
