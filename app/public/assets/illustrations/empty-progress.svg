<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" role="img" aria-labelledby="emptyProgressTitle emptyProgressDesc">
  <title id="emptyProgressTitle">Performance Metric Calibration</title>
  <desc id="emptyProgressDesc">Concentric telemetry rings and unpopulated diagnostic baseline ready to log deliberate practice.</desc>
  <defs>
    <linearGradient id="progBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1319" />
      <stop offset="100%" stop-color="#280B0F" />
    </linearGradient>
    <linearGradient id="progCamel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EADF" />
      <stop offset="100%" stop-color="#C6B39A" />
    </linearGradient>
  </defs>

  <!-- Background Subtle Circular Grid -->
  <circle cx="200" cy="140" r="95" stroke="#7B694E" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.4" />
  <circle cx="200" cy="140" r="75" stroke="#C6B39A" stroke-width="0.75" opacity="0.25" />
  <circle cx="200" cy="140" r="50" stroke="#7B694E" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.5" />

  <!-- Outer Concentric Calibrated Gauge Arcs -->
  <path d="M125 185 A 90 90 0 1 1 275 185" stroke="#3B1319" stroke-width="6" stroke-linecap="round" />
  <path d="M125 185 A 90 90 0 0 1 160 80" stroke="#C6B39A" stroke-width="2.5" stroke-linecap="round" />
  <path d="M185 53 A 90 90 0 0 1 245 68" stroke="#8D3A3C" stroke-width="3" stroke-linecap="round" />

  <!-- Radial Tick Marks (Diagnostic calibration) -->
  <g stroke="#7B694E" stroke-width="1.25" opacity="0.7">
    <line x1="200" y1="40" x2="200" y2="47" />
    <line x1="270" y1="70" x2="265" y2="75" />
    <line x1="130" y1="70" x2="135" y2="75" />
    <line x1="290" y1="140" x2="282" y2="140" />
    <line x1="110" y1="140" x2="118" y2="140" />
  </g>

  <!-- Central Dial Core -->
  <circle cx="200" cy="140" r="38" fill="url(#progBg)" stroke="#C6B39A" stroke-width="1.5" />
  
  <!-- Internal Diamond Badge -->
  <polygon points="200,118 214,140 200,162 186,140" fill="#280B0F" stroke="#8D3A3C" stroke-width="1.25" />
  <circle cx="200" cy="140" r="3" fill="#F2EADF" />

  <!-- Metric Dial Indicator Needle (Calibrated to 0% / Ready baseline) -->
  <line x1="200" y1="140" x2="160" y2="105" stroke="#F2EADF" stroke-width="2" stroke-linecap="round" />
  <circle cx="160" cy="105" r="3" fill="#8D3A3C" stroke="#F2EADF" stroke-width="1" />

  <!-- Horizontal Timeline / Practice Stream Base -->
  <g transform="translate(60, 225)">
    <!-- Base Timeline Track -->
    <line x1="0" y1="15" x2="280" y2="15" stroke="#7B694E" stroke-width="1.25" stroke-dasharray="4 4" opacity="0.6" />
    
    <!-- Milestone Node 1 (Uninitiated) -->
    <circle cx="40" cy="15" r="7" fill="#3B1319" stroke="#C6B39A" stroke-width="1.5" />
    <circle cx="40" cy="15" r="2.5" fill="#C6B39A" />
    <line x1="40" y1="28" x2="40" y2="38" stroke="#7B694E" stroke-width="1" />

    <!-- Milestone Node 2 (Center Pivot) -->
    <circle cx="140" cy="15" r="8" fill="#3B1319" stroke="#8D3A3C" stroke-width="1.75" />
    <polygon points="140,11 143,15 140,19 137,15" fill="#F2EADF" />
    <line x1="140" y1="28" x2="140" y2="40" stroke="#8D3A3C" stroke-width="1" />

    <!-- Milestone Node 3 (Staff Horizon) -->
    <circle cx="240" cy="15" r="7" fill="#280B0F" stroke="#7B694E" stroke-width="1.5" />
    <circle cx="240" cy="15" r="2" fill="#7B694E" />
    <line x1="240" y1="28" x2="240" y2="38" stroke="#7B694E" stroke-width="1" />
  </g>

  <!-- Accent Geometry & Stars -->
  <polygon points="90,95 91.5,99 95,100 91.5,101 90,105 88.5,101 85,100 88.5,99" fill="#C6B39A" />
  <polygon points="310,105 311.5,109 315,110 311.5,111 310,115 308.5,111 305,110 308.5,109" fill="#8D3A3C" />
</svg>
